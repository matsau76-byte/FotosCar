<style>
:root{--bg:#f2f4f7;--surface:#fff;--ink:#111b26;--mute:#5d6b7a;--line:#d9dfe6;--accent:#2446ff;--on-accent:#fff;--danger:#c62f2f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141a;--surface:#18202a;--ink:#eaf0f6;--mute:#93a1b1;--line:#2a3541;--accent:#7f95ff;--on-accent:#0c1030;--danger:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141a;--surface:#18202a;--ink:#eaf0f6;--mute:#93a1b1;--line:#2a3541;--accent:#7f95ff;--on-accent:#0c1030;--danger:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:132px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between}
h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.02em}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:600}
.layout{display:grid;grid-template-columns:132px 1fr;align-items:start}
@media (min-width:600px){.layout{grid-template-columns:220px 1fr}}
#chips{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);display:flex;flex-direction:column;gap:6px;padding:10px 6px 10px 10px;max-height:calc(100vh - 200px);overflow-y:auto}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:600;display:flex;gap:6px;align-items:center;justify-content:space-between;text-align:left;width:100%}
.chip b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip span{color:var(--mute);font-weight:400;font-size:13px;flex:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.on span{color:var(--on-accent);opacity:.8}
.chip.add{border-style:dashed;background:transparent;color:var(--accent);justify-content:center}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:3px;padding:3px}
.th{aspect-ratio:1;border:0;padding:0;background:var(--line);border-radius:6px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:56px 28px;margin:0}
#warn{margin:10px 14px 0;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--danger);font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px))}
#dest{font-size:14px;color:var(--mute);margin:0 0 8px;text-align:center}
#dest b{color:var(--ink)}
.btns{display:flex;gap:10px}
.btn{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;font-weight:600}
.btn.main{flex:2;background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:800;font-size:17px}
.btn.danger{color:var(--danger)}
dialog{border:0;border-radius:20px;padding:18px;width:min(92vw,420px);background:var(--surface);color:var(--ink);max-height:88vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 12px;font-size:19px}
dialog p{margin:0 0 12px;color:var(--mute)}
dialog input[type=text],dialog select{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:12px}
dialog img{width:100%;max-height:52vh;object-fit:contain;border-radius:10px;background:var(--bg);margin-bottom:12px}
.row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:8px}
.list .btn{text-align:left;flex:none}
.sug{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
:root{--bg:#f4f6f8;--surface:#fff;--ink:#0e1a26;--mute:#5b6876;--line:#dde3ea;--accent:#1747b8;--on-accent:#fff;--danger:#b42318;--shadow:0 1px 2px rgba(14,26,38,.06),0 4px 14px rgba(14,26,38,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1218;--surface:#151c25;--ink:#e8eef5;--mute:#8d9bab;--line:#243040;--accent:#6c8cff;--on-accent:#0a1030;--danger:#ff8a80;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0d1218;--surface:#151c25;--ink:#e8eef5;--mute:#8d9bab;--line:#243040;--accent:#6c8cff;--on-accent:#0a1030;--danger:#ff8a80;--shadow:0 1px 2px rgba(0,0,0,.4)}
body{-webkit-font-smoothing:antialiased}
body::before{background:var(--surface)}
header{padding:12px 16px;background:var(--surface)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;flex:none}
h1{font-size:18px;line-height:1.15}
#sub{margin:2px 0 0;font-size:13px;color:var(--mute)}
.icon{display:inline-flex;align-items:center;gap:6px;font-size:14px;box-shadow:var(--shadow)}
#chips{top:calc(env(safe-area-inset-top,0px) + 61px);padding:12px 6px 12px 12px;gap:4px}
#chips::before{content:"Carpetas";font-size:13px;font-weight:600;color:var(--mute);padding:2px 4px 6px}
.chip{border:1px solid transparent;background:transparent;font-size:15px}
.chip:hover{background:var(--surface)}
.chip.on{background:var(--surface);border-color:var(--line);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent),var(--shadow)}
.chip.on span{color:var(--accent);opacity:1;font-weight:600}
.chip.add{border:1px dashed var(--line);margin-top:6px;color:var(--accent)}
#grid{gap:6px;padding:12px 12px 12px 6px}
.th{border-radius:8px;box-shadow:var(--shadow)}
.bar{box-shadow:0 -6px 20px rgba(14,26,38,.08)}
#dest{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px}
.btn.main{box-shadow:0 2px 8px rgba(23,71,184,.3)}
.list .btn{justify-content:flex-start}
dialog{border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#fname,.sug{text-transform:uppercase}
.chip b{font-size:14px;letter-spacing:.02em}
:root{--bg:#050806;--surface:#0f1411;--ink:#f1f7f3;--mute:#8fa398;--line:#1f2b24;--accent:#00c853;--on-accent:#03140a;--danger:#ff6b5e;--shadow:0 1px 2px rgba(0,0,0,.6);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050806;--surface:#0f1411;--ink:#f1f7f3;--mute:#8fa398;--line:#1f2b24;--accent:#00c853;--on-accent:#03140a;--danger:#ff6b5e;--shadow:0 1px 2px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#050806;--surface:#0f1411;--ink:#f1f7f3;--mute:#8fa398;--line:#1f2b24;--accent:#00c853;--on-accent:#03140a;--danger:#ff6b5e;--shadow:0 1px 2px rgba(0,0,0,.6)}
.btn.main{box-shadow:0 2px 14px rgba(0,200,83,.35)}
.bar{box-shadow:0 -6px 24px rgba(0,0,0,.6)}
.bar .btn{position:relative;overflow:hidden}
.ov{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.th{position:relative;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.th img{-webkit-touch-callout:none;-webkit-user-drag:none;pointer-events:none}
.th .chk{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:999px;border:2px solid #fff;background:rgba(5,8,6,.55);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.5);pointer-events:none}
.th .chk svg{display:none;width:14px;height:14px}
.th.sel{box-shadow:inset 0 0 0 3px var(--accent),var(--shadow)}
.th.sel img{opacity:.78}
.th.sel .chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.th.sel .chk svg{display:block}
body.selecting{padding-bottom:190px}
.seltop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
#selcount{font-size:14px;font-weight:800;color:var(--ink)}
.selmeta{display:flex;gap:6px}
.sbtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
.selbtns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.selbtns .btn{padding:11px 10px;font-size:14px}
.btn:disabled{opacity:.42;cursor:default}
#normalbar .btns{gap:8px}
#normalbar .btn{padding:12px 8px;font-size:13px;line-height:1.15;text-align:center}
#normalbar .btn svg{flex:none}
#normalbar .btn.main{flex:1.35;font-size:15px}
#camview{position:fixed;inset:0;z-index:25;background:#000;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#camview[hidden]{display:none}
#camvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#camvid.mirror{transform:scaleX(-1)}
#camflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .16s ease-out;z-index:2}
#camflash.on{opacity:.75;transition:none}
.camtop{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 14px;background:linear-gradient(to bottom,rgba(5,8,6,.82),rgba(5,8,6,0))}
.camfol{border:1px solid rgba(255,255,255,.22);background:rgba(15,20,17,.82);color:#f1f7f3;border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;max-width:66%;min-width:0;backdrop-filter:blur(6px)}
.camfol span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.camdone{border:0;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:9px 16px;font-size:15px;font-weight:800;flex:none;box-shadow:0 2px 12px rgba(0,200,83,.35)}
.cambot{position:relative;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(5,8,6,.88),rgba(5,8,6,0))}
.camleft{display:flex;align-items:center;gap:10px;min-width:0}
.camth{width:46px;height:46px;border-radius:10px;border:2px solid rgba(255,255,255,.35);background:rgba(15,20,17,.75);overflow:hidden;flex:none;display:grid;place-items:center}
.camth img{width:100%;height:100%;object-fit:cover;display:block}
.camth img[hidden]{display:none}
#camcnt{color:#f1f7f3;font-size:14px;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.8)}
#shutter{width:76px;height:76px;border-radius:999px;border:4px solid #fff;background:rgba(255,255,255,.18);padding:5px;display:grid;place-items:center;transition:transform .08s}
#shutter::after{content:"";width:100%;height:100%;border-radius:999px;background:#fff;display:block}
#shutter:active{transform:scale(.92)}
#shutter:disabled{opacity:.4}
.camright{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.camctl{width:46px;height:46px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(15,20,17,.78);color:#f1f7f3;display:grid;place-items:center;backdrop-filter:blur(6px)}
.camctl[hidden]{display:none}
.camctl.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
#camerr{position:relative;z-index:3;margin:auto 20px;padding:20px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.6)}
#camerr[hidden]{display:none}
#camerr h2{margin:0 0 8px;font-size:18px}
#camerr p{margin:0 0 16px;color:var(--mute);font-size:15px}
#camerr .row{margin-bottom:0}
</style>
</head>
<body>
<header>
  <div class="top"><div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M7 12.5a2 2 0 0 1 2-2h1.6l1.1-1.7a1 1 0 0 1 .85-.45h3.9a1 1 0 0 1 .85.45l1.1 1.7H23a2 2 0 0 1 2 2V21a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z" fill="var(--on-accent)"/><circle cx="16" cy="16.8" r="3.6" fill="var(--accent)"/><circle cx="16" cy="16.8" r="1.7" fill="var(--on-accent)"/></svg><div><h1>Mis fotos</h1><p id="sub"></p></div></div><button class="icon" data-act="menu" aria-label="Opciones de la carpeta"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>Opciones</button></div>
</header>
<div id="warn" hidden>Este navegador no permite guardar datos. Las fotos se perderán al cerrar la página.</div>
<div class="layout"><nav id="chips" aria-label="Carpetas"></nav><main id="grid"></main></div>
<div class="bar">
  <div id="normalbar">
    <p id="dest"></p>
    <div class="btns">
      <label class="btn"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/></svg>Galería<input id="gal" class="ov" type="file" accept="image/*" multiple></label>
      <button class="btn" id="contbtn" data-act="contcam"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="15" height="12" rx="2"/><circle cx="9.5" cy="13" r="2.8"/><path d="M17 10.5l5-3v11l-5-3"/></svg>Cámara continua</button>
      <label class="btn main"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Hacer foto<input id="cam" class="ov" type="file" accept="image/*" capture="environment"></label>
    </div>
  </div>
  <div id="selbar" hidden>
    <div class="seltop">
      <span id="selcount">0 seleccionadas</span>
      <div class="selmeta">
        <button class="sbtn" data-act="selall">Seleccionar todas</button>
        <button class="sbtn" data-act="seloff">Cancelar</button>
      </div>
    </div>
    <div class="selbtns">
      <button class="btn" data-act="movemany">Mover a carpeta</button>
      <button class="btn" data-act="sharemany">Compartir</button>
      <button class="btn" data-act="zipmany">Descargar</button>
      <button class="btn danger" data-act="delmany">Eliminar</button>
    </div>
  </div>
</div>
<div id="camview" hidden aria-label="Cámara continua">
  <video id="camvid" autoplay playsinline muted></video>
  <div id="camflash"></div>
  <div class="camtop">
    <button class="camfol" data-act="camfolder" aria-label="Cambiar carpeta de destino"><span id="camfolname">SIN CLASIFICAR</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="camdone" data-act="camdone">Listo</button>

    <div class="row"><button class="btn" data-act="camdone">Cerrar</button><button class="btn main" data-act="camfallback">Hacer foto</button></div>

  <div class="cambot">
    <div class="camleft">

      <button class="camctl" id="torchbtn" data-act="camtorch" aria-label="Linterna" aria-pressed="false" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></button>
      <button class="camctl" id="flipbtn" data-act="camflip" aria-label="Cambiar cámara"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></button>
    </div>
  </div>
</div>
<dialog id="sheet"></dialog>
<div id="toast" role="status"></div>
<script>
const INBOX={id:'inbox',name:'SIN CLASIFICAR'};
const EXT={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','image/heic':'heic','image/heif':'heif'};
const OKEXT=['jpg','png','webp','gif'];
let folders=[INBOX],photos=[],cur='inbox',db=null,urls={},selMode=false,selected=new Set(),lpTimer=null,lpStart=null,suppressClick=false;
let camStream=null,camCapture=null,camFacing='environment',camTorch=false,camCount=0,camTaking=false,wakeLock=null,lastPhotoT=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fol=id=>folders.find(f=>f.id===id)||INBOX;
const count=id=>photos.filter(p=>p.folder===id).length;
const curPhotos=()=>photos.filter(p=>p.folder===cur);
const selPhotos=()=>photos.filter(p=>p.folder===cur&&selected.has(p.id));

function openDB(){return new Promise((ok,no)=>{try{const r=indexedDB.open('fotos-carpetas',1);r.onupgradeneeded=()=>{r.result.createObjectStore('folders',{keyPath:'id'});r.result.createObjectStore('photos',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}})}
function put(s,v){if(!db)return;try{db.transaction(s,'readwrite').objectStore(s).put(v)}catch(e){}}
function del(s,id){if(!db)return;try{db.transaction(s,'readwrite').objectStore(s).delete(id)}catch(e){}}
function getAll(s){return new Promise(ok=>{try{const r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>ok([])}catch(e){ok([])}})}

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function thumb(p){return urls[p.id]||(urls[p.id]=URL.createObjectURL(p.blob))}
function exitSel(){selMode=false;selected.clear()}

function render(){
  $('#chips').innerHTML=folders.map(f=>`<button class="chip${f.id===cur?' on':''}" data-act="pick" data-id="${f.id}"><b>${esc(f.name)}</b><span>${count(f.id)}</span></button>`).join('')+`<button class="chip add" data-act="newf">+ Carpeta</button>`;
  const list=curPhotos().sort((a,b)=>b.t-a.t);
  if(selMode){const valid=new Set(list.map(p=>p.id));for(const id of selected)if(!valid.has(id))selected.delete(id);if(!selected.size)exitSel()}
  const chk='<span class="chk" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span>';
  $('#grid').innerHTML=list.length?list.map(p=>`<button class="th${selMode&&selected.has(p.id)?' sel':''}" data-act="view" data-id="${p.id}" draggable="false" aria-label="${selMode?'Seleccionar foto':'Abrir foto'}"><img src="${thumb(p)}" alt="" loading="lazy" draggable="false">${selMode?chk:''}</button>`).join(''):`<p class="empty">${cur==='inbox'?'Aún no hay fotos. Toca “Hacer foto” para empezar.':'Esta carpeta está vacía. Las fotos que hagas se guardarán aquí.'}</p>`;
  $('#dest').innerHTML=`Las fotos nuevas se guardan en <b>${esc(fol(cur).name)}</b>`;
  $('#sub').textContent=`${photos.length} ${photos.length===1?'foto':'fotos'} en ${folders.length} ${folders.length===1?'carpeta':'carpetas'}`;
  $('#normalbar').hidden=selMode;
  $('#selbar').hidden=!selMode;
  document.body.classList.toggle('selecting',selMode);
  if(selMode){
    const n=selected.size;
    $('#selcount').textContent=`${n} ${n===1?'seleccionada':'seleccionadas'}`;
    document.querySelectorAll('#selbar .selbtns .btn').forEach(b=>b.disabled=!n);
  }
  const on=$('.chip.on');if(on)on.scrollIntoView({inline:'nearest',block:'nearest'});
  try{localStorage.setItem('fotos-cur',cur)}catch(e){}
}

async function addFiles(fs){
  let n=0;
  for(const f of fs){
    if(!f.type.startsWith('image/'))continue;
    const t=Math.max(Date.now()+n,lastPhotoT+1);lastPhotoT=t;
    const p={id:uid(),folder:cur,blob:f,type:f.type,t};
    photos.push(p);put('photos',p);n++;
  }
  render();
  if(n)toast(n===1?`Guardada en ${fol(cur).name}`:`${n} fotos guardadas en ${fol(cur).name}`);
}

function saveCapturedBlob(blob,folderId){
  if(!blob)return null;
  const t=Math.max(Date.now(),lastPhotoT+1);lastPhotoT=t;
  const p={id:uid(),folder:folderId,blob,type:blob.type||'image/jpeg',t};
  photos.push(p);put('photos',p);
  camCount++;
  $('#camcnt').textContent=`${camCount} ${camCount===1?'foto':'fotos'}`;
  const th=$('#camthumb');
  th.src=thumb(p);th.hidden=false;
  return p;
}

async function reqWakeLock(){
  try{
    if('wakeLock' in navigator&&!wakeLock){
      wakeLock=await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release',()=>{wakeLock=null});
    }
  }catch(e){}
}
async function relWakeLock(){
  if(wakeLock){try{await wakeLock.release()}catch(e){}wakeLock=null}
}

function stopCamStream(){
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}
  camCapture=null;camTorch=false;
  const tb=$('#torchbtn');tb.classList.remove('on');tb.setAttribute('aria-pressed','false');tb.hidden=true;
  $('#camvid').srcObject=null;
}

async function startCamStream(){
  stopCamStream();
  $('#camerr').hidden=true;
  $('#shutter').disabled=true;
  const vid=$('#camvid');
  vid.classList.toggle('mirror',camFacing==='user');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    $('#camerrmsg').textContent='Tu navegador o conexión no permite usar la cámara en directo (se requiere HTTPS). Usa “Hacer foto” como alternativa.';
    $('#camerr').hidden=false;
    return;
  }
  try{
    let stream;
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:camFacing},width:{ideal:4096},height:{ideal:3072}}});
    }catch(err){
      if(err&&(err.name==='OverconstrainedError'||err.name==='ConstraintNotSatisfiedError')){
        stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:camFacing}});
      }else throw err;
    }
    if($('#camview').hidden){stream.getTracks().forEach(t=>t.stop());return}
    camStream=stream;
    vid.srcObject=stream;
    await vid.play().catch(()=>{});
    const track=stream.getVideoTracks()[0];
    if(track&&typeof ImageCapture!=='undefined'){
      try{camCapture=new ImageCapture(track)}catch(e){camCapture=null}
    }
    const caps=track&&track.getCapabilities?track.getCapabilities():{};
    $('#torchbtn').hidden=!(caps&&caps.torch);
    $('#shutter').disabled=false;
  }catch(err){
    let msg='No se pudo abrir la cámara en directo. Usa “Hacer foto” como alternativa.';
    if(err&&(err.name==='NotAllowedError'||err.name==='PermissionDeniedError'))msg='Has denegado el permiso de cámara. Actívalo en los ajustes del navegador o usa “Hacer foto”.';
    else if(err&&(err.name==='NotFoundError'||err.name==='DevicesNotFoundError'))msg='No se encontró ninguna cámara disponible. Usa “Hacer foto” como alternativa.';
    $('#camerrmsg').textContent=msg;
    $('#camerr').hidden=false;
  }
}

async function openContCam(){
  camCount=0;camFacing='environment';
  $('#camcnt').textContent='0 fotos';
  const th=$('#camthumb');th.hidden=true;th.removeAttribute('src');
  $('#camfolname').textContent=fol(cur).name;
  $('#camview').hidden=false;
  reqWakeLock();
  await startCamStream();
}

function closeContCam(){
  stopCamStream();
  relWakeLock();
  $('#camview').hidden=true;
  render();
  if(camCount)toast(camCount===1?'1 foto guardada':`${camCount} fotos guardadas`);
}

function canvasSnap(){
  return new Promise(ok=>{
    const vid=$('#camvid');
    const w=vid.videoWidth||1280,h=vid.videoHeight||720;
    const c=document.createElement('canvas');
    c.width=w;c.height=h;
    c.getContext('2d').drawImage(vid,0,0,w,h);
    c.toBlob(b=>ok(b),'image/jpeg',0.9);
  });
}

async function shootCont(){
  if(!camStream)return;
  const fl=$('#camflash');
  fl.classList.add('on');
  clearTimeout(shootCont.t);
  shootCont.t=setTimeout(()=>fl.classList.remove('on'),110);
  try{if(navigator.vibrate)navigator.vibrate(15)}catch(e){}
  const targetFolder=cur;
  if(camCapture&&!camTaking){
    camTaking=true;
    try{
      const blob=await camCapture.takePhoto();
      saveCapturedBlob(blob,targetFolder);
      return;
    }catch(e){}finally{camTaking=false}
  }
  const blob=await canvasSnap();
  saveCapturedBlob(blob,targetFolder);
}

const sh=$('#sheet');
function sheet(h){sh.innerHTML=h;if(!sh.open)sh.showModal();const i=sh.querySelector('input[type=text]');if(i)setTimeout(()=>i.focus(),50)}
sh.addEventListener('click',e=>{if(e.target===sh)sh.close()});

let moveTargetIds=null;
function newFolderSheet(ids=null){
  moveTargetIds=ids;
  const used=folders.map(f=>f.name.toLowerCase());
  const sug=['Familia','Viajes','Comida','Documentos','Trabajo'].filter(s=>!used.includes(s.toLowerCase()));
  sheet(`<h2>Nueva carpeta</h2><input type="text" id="fname" maxlength="40" placeholder="Nombre de la carpeta" autocomplete="off">
  <div class="row">${sug.map(s=>`<button class="sug" data-act="sug" data-v="${s}">${s}</button>`).join('')}</div>
  <div class="row"><button class="btn" data-act="close">Cancelar</button><button class="btn main" data-act="${ids?'createmove':'create'}">Crear</button></div>`);
}
function renameSheet(){
  sheet(`<h2>Renombrar carpeta</h2><input type="text" id="fname" maxlength="40" value="${esc(fol(cur).name)}" autocomplete="off">
  <div class="row"><button class="btn" data-act="close">Cancelar</button><button class="btn main" data-act="rename">Guardar</button></div>`);
}
function menuSheet(){
  const f=fol(cur),inbox=cur==='inbox';
  sheet(`<h2>${esc(f.name)}</h2><div class="list">
  ${inbox?'':'<button class="btn" data-act="ren">Renombrar carpeta</button>'}
  <button class="btn" data-act="sharef">Compartir las fotos de esta carpeta</button>
  <button class="btn" data-act="zipf">Descargar esta carpeta (ZIP)</button>
  <button class="btn" data-act="zipall">Descargar todo (ZIP con carpetas)</button>
  ${inbox?'':'<button class="btn danger" data-act="delf">Eliminar carpeta</button>'}
  <button class="btn" data-act="close">Cerrar</button></div>`);
}
function viewSheet(id){
  const p=photos.find(x=>x.id===id);if(!p)return;
  const d=new Date(p.t).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'});
  sheet(`<img src="${thumb(p)}" alt="Foto"><p>${d}</p>
  <select id="mv" data-id="${p.id}" aria-label="Mover a carpeta"><option value="__new__">+ Nueva carpeta</option>${folders.map(f=>`<option value="${f.id}"${f.id===p.folder?' selected':''}>${p.folder===f.id?'En: ':'Mover a: '}${esc(f.name)}</option>`).join('')}</select>
  <div class="row"><button class="btn main" data-act="share1" data-id="${p.id}">Compartir</button><button class="btn" data-act="dl1" data-id="${p.id}">Descargar</button><button class="btn danger" data-act="delp" data-id="${p.id}">Eliminar</button></div>
  <button class="btn" style="width:100%" data-act="close">Cerrar</button>`);
}

function pname(p,i){const d=new Date(p.t),z=n=>String(n).padStart(2,'0');return `${safe(fol(p.folder).name)}-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}${i?'-'+i:''}.${EXT[p.type]||'jpg'}`}
const safe=s=>s.replace(/[\\\/:*?"<>|]/g,'-').trim()||'carpeta';
async function save(filename,data){
  try{
    const blob=data instanceof Blob?data:new Blob([data]);
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){toast('No se pudo descargar')}
}
async function share(list){
  if(!list.length){toast('No hay fotos que compartir');return}
  try{
    const files=list.map((p,i)=>new File([p.blob],pname(p,i),{type:p.type||'image/jpeg'}));
    if(!navigator.canShare||!navigator.canShare({files})){toast('Compartir no está disponible aquí. Usa Descargar');return}
    await navigator.share({files});
  }catch(e){if(!e||e.name!=='AbortError')toast('No se pudo abrir el menú de compartir')}
}
async function zip(list,filename){
  if(!list.length){toast('No hay fotos que descargar');return}
  if(!window.JSZip){toast('No se pudo cargar el compresor ZIP');return}
  toast('Preparando ZIP…');
  const z=new JSZip(),seen=new Set();
  list.forEach(([dir,p])=>{let i=0,n;do{n=(dir?safe(dir)+'/':'')+pname(p,i++)}while(seen.has(n));seen.add(n);z.file(n,p.blob)});
  const blob=await z.generateAsync({type:'blob',compression:'STORE'});
  await save(filename,blob);
}

document.addEventListener('click',async e=>{
  if(suppressClick){suppressClick=false;return}
  if(selMode&&!e.target.closest('.th[data-id],.bar,dialog')){
    exitSel();render();
    if(!e.target.closest('[data-act="pick"]'))return;
  }
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='pick'){if(cur!==id)exitSel();cur=id;render()}
  else if(a==='seloff'){exitSel();render()}
  else if(a==='selall'){curPhotos().forEach(p=>selected.add(p.id));render()}
  else if(a==='movemany'){
    if(!selected.size)return;
    sheet(`<h2>Mover ${selected.size} ${selected.size===1?'foto':'fotos'} a…</h2><div class="list">
    <button class="btn main" data-act="newmove">+ Nueva carpeta</button>
    ${folders.map(f=>`<button class="btn" data-act="moveto" data-id="${f.id}"${f.id===cur?' disabled':''}>${esc(f.name)}${f.id===cur?' (Actual)':''}</button>`).join('')}
    <button class="btn" data-act="close">Cancelar</button></div>`);
  }
  else if(a==='newmove'){
    const ids=selPhotos().map(p=>p.id);
    if(!ids.length)return;
    newFolderSheet(ids);
  }
  else if(a==='moveto'){
    const dest=fol(id);let n=0;
    photos.forEach(p=>{if(p.folder===cur&&selected.has(p.id)){p.folder=dest.id;put('photos',p);n++}});
    exitSel();sh.close();render();
    toast(n===1?`1 foto movida a ${dest.name}`:`${n} fotos movidas a ${dest.name}`);
  }
  else if(a==='sharemany'){await share(selPhotos())}
  else if(a==='zipmany'){const list=selPhotos().map(p=>['',p]);if(!list.length)return;await zip(list,safe(fol(cur).name)+'.zip');exitSel();render()}
  else if(a==='delmany'){
    const n=selected.size;if(!n)return;
    sheet(`<h2>¿Eliminar ${n} ${n===1?'foto':'fotos'}?</h2><p>Esta acción no se puede deshacer.</p>
    <div class="row"><button class="btn" data-act="close">Cancelar</button><button class="btn danger" data-act="delmany2">Eliminar</button></div>`);
  }
  else if(a==='delmany2'){
    const list=selPhotos(),n=list.length;
    const ids=new Set(list.map(p=>p.id));
    list.forEach(p=>{
      del('photos',p.id);
      if(urls[p.id]){URL.revokeObjectURL(urls[p.id]);delete urls[p.id]}
    });
    photos=photos.filter(p=>!ids.has(p.id));
    exitSel();sh.close();render();
    toast(n===1?'1 foto eliminada':`${n} fotos eliminadas`);
  }
  else if(a==='newf')newFolderSheet();
  else if(a==='sug'){$('#fname').value=b.dataset.v;$('#fname').focus()}
  else if(a==='create'){
    const n=$('#fname').value.trim();if(!n)return;
    const N=n.toUpperCase();let f=folders.find(x=>x.name.toUpperCase()===N);
    if(!f){f={id:uid(),name:N};folders.push(f);put('folders',f)}
    exitSel();cur=f.id;sh.close();render();toast(`Carpeta “${f.name}” lista`);
  }
  else if(a==='createmove'){
    const n=$('#fname').value.trim();if(!n)return;
    const N=n.toUpperCase();let f=folders.find(x=>x.name.toUpperCase()===N);
    if(!f){f={id:uid(),name:N};folders.push(f);put('folders',f)}
    const ids=new Set(moveTargetIds||[]);moveTargetIds=null;
    let moved=0;
    photos.forEach(p=>{if(ids.has(p.id)){p.folder=f.id;put('photos',p);moved++}});
    exitSel();cur=f.id;sh.close();render();
    toast(moved===1?`1 foto movida a ${f.name}`:`${moved} fotos movidas a ${f.name}`);
  }
  else if(a==='menu')menuSheet();
  else if(a==='ren')renameSheet();
  else if(a==='rename'){
    const n=$('#fname').value.trim();if(!n)return;
    const f=fol(cur);f.name=n.toUpperCase();put('folders',f);sh.close();render();
  }
  else if(a==='delf'){
    if(cur==='inbox')return;
    const c=count(cur);
    sheet(`<h2>${c?`¿Eliminar “${esc(fol(cur).name)}” y sus ${c} ${c===1?'foto':'fotos'}?`:`¿Eliminar “${esc(fol(cur).name)}”?`}</h2><p>Esta acción no se puede deshacer.</p>
    <div class="row"><button class="btn" data-act="close">Cancelar</button><button class="btn danger" data-act="delf2">Eliminar carpeta y fotos</button></div>
    ${c?'<button class="btn" style="width:100%" data-act="zipbefore">Descargar ZIP antes</button>':''}`);
  }
  else if(a==='zipbefore'){await zip(photos.filter(p=>p.folder===cur).map(p=>['',p]),safe(fol(cur).name)+'.zip')}
  else if(a==='delf2'){
    if(cur==='inbox')return;
    photos.filter(p=>p.folder===cur).forEach(p=>{
      del('photos',p.id);
      if(urls[p.id]){URL.revokeObjectURL(urls[p.id]);delete urls[p.id]}
    });
    photos=photos.filter(p=>p.folder!==cur);
    folders=folders.filter(f=>f.id!==cur);del('folders',cur);cur='inbox';exitSel();sh.close();render();
    toast('Carpeta y fotos eliminadas');
  }
  else if(a==='zipf'){sh.close();await zip(photos.filter(p=>p.folder===cur).map(p=>['',p]),safe(fol(cur).name)+'.zip')}
  else if(a==='zipall'){sh.close();await zip(photos.map(p=>[fol(p.folder).name,p]),'mis-fotos.zip')}
  else if(a==='share1'){await share(photos.filter(x=>x.id===id))}
  else if(a==='sharef'){sh.close();await share(photos.filter(p=>p.folder===cur))}
  else if(a==='view'){
    if(selMode){
      if(selected.has(id)){selected.delete(id);if(!selected.size)exitSel()}
      else selected.add(id);
      render();
    }else viewSheet(id);
  }
  else if(a==='dl1'){
    const p=photos.find(x=>x.id===id);if(!p)return;
    const ext=EXT[p.type]||'jpg';
    if(OKEXT.includes(ext))await save(pname(p,0),p.blob);else await zip([['',p]],safe(fol(p.folder).name)+'.zip');
  }
  else if(a==='delp'){
    const p=photos.find(x=>x.id===id);if(!p)return;
    photos=photos.filter(x=>x.id!==id);del('photos',id);
    if(urls[id]){URL.revokeObjectURL(urls[id]);delete urls[id]}
    sh.close();render();toast('Foto eliminada');
  }
  else if(a==='contcam'){await openContCam()}
  else if(a==='camdone'){closeContCam()}
  else if(a==='camfallback'){closeContCam();$('#cam').click()}
  else if(a==='shoot'){await shootCont()}
  else if(a==='camflip'){camFacing=camFacing==='environment'?'user':'environment';await startCamStream()}
  else if(a==='camtorch'){
    if(!camStream)return;
    const track=camStream.getVideoTracks()[0];if(!track)return;
    camTorch=!camTorch;
    try{
      await track.applyConstraints({advanced:[{torch:camTorch}]});
      const tb=$('#torchbtn');tb.classList.toggle('on',camTorch);tb.setAttribute('aria-pressed',String(camTorch));
    }catch(e){camTorch=!camTorch;toast('No se pudo activar la linterna')}
  }
  else if(a==='camfolder'){
    sheet(`<h2>Guardar fotos en…</h2><div class="list">
    ${folders.map(f=>`<button class="btn" data-act="camsetfol" data-id="${f.id}">${esc(f.name)}${f.id===cur?' (actual)':''}</button>`).join('')}
    <button class="btn" data-act="close">Cancelar</button></div>`);
  }
  else if(a==='camsetfol'){
    cur=id;$('#camfolname').textContent=fol(cur).name;sh.close();
    try{localStorage.setItem('fotos-cur',cur)}catch(e){}
    toast(`Destino: ${fol(cur).name}`);
  }
  else if(a==='camera'){$('#cam').click()}
  else if(a==='gallery'){$('#gal').click()}
  else if(a==='close')sh.close();
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&!$('#camview').hidden)reqWakeLock();
});
const gridEl=$('#grid');
function clearLP(){clearTimeout(lpTimer);lpTimer=null;lpStart=null}
gridEl.addEventListener('pointerdown',e=>{
  const th=e.target.closest('.th[data-id]');if(!th||e.button>0)return;
  clearLP();
  lpStart={x:e.clientX,y:e.clientY,id:th.dataset.id};
  lpTimer=setTimeout(()=>{
    const id=lpStart&&lpStart.id;
    clearLP();
    if(!id)return;
    suppressClick=true;
    selMode=true;
    selected.add(id);
    try{if(navigator.vibrate)navigator.vibrate(20)}catch(err){}
    render();
  },500);
});
gridEl.addEventListener('pointermove',e=>{
  if(!lpStart)return;
  if(Math.hypot(e.clientX-lpStart.x,e.clientY-lpStart.y)>10)clearLP();
});
gridEl.addEventListener('pointerup',()=>{clearLP();if(suppressClick)setTimeout(()=>suppressClick=false,80)});
gridEl.addEventListener('pointercancel',clearLP);
gridEl.addEventListener('contextmenu',e=>{if(e.target.closest('.th'))e.preventDefault()});
gridEl.addEventListener('dragstart',e=>{if(e.target.closest('.th'))e.preventDefault()});
document.addEventListener('pointerdown',()=>{suppressClick=false},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selMode&&!sh.open){exitSel();render()}});
sh.addEventListener('change',e=>{
  if(e.target.id!=='mv')return;
  const p=photos.find(x=>x.id===e.target.dataset.id);if(!p)return;
  if(e.target.value==='__new__'){newFolderSheet([p.id]);return}
  p.folder=e.target.value;put('photos',p);sh.close();render();toast(`Movida a ${fol(p.folder).name}`);
});
sh.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='fname'){const b=sh.querySelector('[data-act=create],[data-act=rename],[data-act=createmove]');if(b)b.click()}});
for(const id of ['cam','gal'])$('#'+id).addEventListener('change',e=>{addFiles([...e.target.files]);e.target.value=''});

(async()=>{
  try{
    db=await openDB();
    const fs=await getAll('folders');fs.forEach(f=>{if(f.name!==f.name.toUpperCase()){f.name=f.name.toUpperCase();put('folders',f)}});folders=[INBOX,...fs.sort((a,b)=>a.name.localeCompare(b.name,'es'))];
    photos=await getAll('photos');
  }catch(e){db=null;$('#warn').hidden=false}
  try{const c=localStorage.getItem('fotos-cur');if(c&&folders.some(f=>f.id===c))cur=c}catch(e){}
  render();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
